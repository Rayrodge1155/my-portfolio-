<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    body {
        background-color: #2c3e50; /* Fallback color so text is visible */
        background-image: url('gucci-image.jpg'); 
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        color: white;
    }

    nav {
        width: 100%;
        padding: 20px;
        background: rgba(0, 0, 0, 0.5);
        text-align: center;
        font-weight: bold;
        letter-spacing: 2px;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .portfolio-card {
        background: rgba(255, 255, 255, 0.15); 
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        max-width: 500px;
        margin: 40px 20px;
        text-align: center;
    }

    img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 50%; /* Circular profile pic */
        border: 3px solid white;
        margin-bottom: 15px;
    }

    .contact-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    input[type="email"] {
        flex: 2;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
    }

    button {
        flex: 1;
        background-color: #a0df17;
        color: #000;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    footer {
        margin-top: auto;
        padding: 40px 0;
        text-align: center;
    }

    .social-icons a {
        color: white;
        font-size: 24px;
        margin: 0 15px;
        text-decoration: none;
    }
    </style>
</head>
<body>
    <nav>RAY-RODGE</nav>

    <div class="portfolio-card">
        <h1>Ray's portfolio</h1>
        <img src="my-image.jpg" alt="Ray's Profile"> 
        
        <h2>ABOUT Ray</h2>
        <p>Hi, I'm Raymond, A 21 year old frontend dev dedicated to build any exterior landing webpage...</p>

        <h3>Program learnt</h3>
        <ul style="text-align: left; display: inline-block;">
            <li>Html</li>
            <li>Css</li>
            <li>A bit of java and python</li>
        </ul>
        
        <p>Contact Me:</p>
        <div class="contact-group">
            <input type="email" placeholder="Enter your email">
            <button type="button">Send</button>
        </div>
    </div>

    <footer>
        <div class="social-icons">
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
        <p>@RAY-RODGE.2026</p>
    </footer>
</body>
</html>
