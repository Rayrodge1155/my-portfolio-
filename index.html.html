<!DOCTYPE html>
<html lang="en">
<head>
    <title>My portfolio</title>
    <style>
    body {
        background-image: url('gucci-image.jpg'); /* */
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        font-family: Arial, Helvetica, sans-serif; /* */
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        color: white;
    }

    nav {
        width: 100%;
        padding: 20px;
        background: rgba(0, 0, 0, 0.3);
        text-align: center;
        font-weight: bold;
        letter-spacing: 2px;
        position: sticky; /* Keeps RAY-RODGE at the top */
        top: 0;
        z-index: 1000;
    }

    .portfolio-card {
        background: rgba(255, 255, 255, 0.15); /* */
        backdrop-filter: blur(10px); /* */
        -webkit-backdrop-filter: blur(10px); /* */
        border: 1px solid rgba(255, 255, 255, 0.2); /* */
        padding: 30px;
        border-radius: 15px; /* */
        box-shadow: 0 10px 20px rgba(0,0,0,0.2); /* */
        max-width: 500px;
        margin: 40px 20px;
    }

    img {
        width: 100px; /* */
        border-radius: 15px; /* */
        margin-bottom: 15px;
    }

    ul { 
        list-style-type: disc; /* */
        padding-left: 20px;
    }

    input[type="email"] {
        padding: 10px;
        border-radius: 5px;
        border: none;
        margin-bottom: 20px;
        width: 80%;
    }

    footer {
        margin-top: auto;
        padding: 20px;
        font-size: 0.8rem;
    }
    .contact-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

input[type="email"] {
    flex: 2;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.1);
    color: white;
    outline: none;
}

button {
    flex: 1;
    background-color: #a0df17; /* Matching your original pink theme! */
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, background 0.3s;
}

/* This makes the button "pop" when you hover over it */
button:hover {
    background-color: #d44466;
    transform: translateY(-2px);
}
footer {
    text-align: center;
    padding: 40px 0;
    width: 100%;
}

.social-icons {
    margin-bottom: 15px;
}

.social-icons a {
    color: white;
    font-size: 24px;
    margin: 0 15px;
    text-decoration: none;
    transition: color 0.3s, transform 0.3s;
    display: inline-block;
}

/* Hover effect to make them feel "alive" */
.social-icons a:hover {
    color: #ee5578; /* Using your signature pink */
    transform: scale(1.2);
}
    </style>
</head>
<body>
    <nav>RAY-RODGE</nav>

    <div class="portfolio-card">
        <h1>Ray's portfolio</h1> <img src="profile.jpg.JPEG" alt="Ray's Profile"> <h2>ABOUT Ray</h2> <p>
          Hi, I'm Raymond, A 21 year old frontend dev dedicated to build any exterior landing webpage... </p>

        <h3>Program learnt</h3> <ul>
            <li>Html</li> <li>Css</li> <li>A bit of java and python</li> </ul>
        
        <p>Contact Me:</p>
        
<div class="contact-group">
    <input type="email" placeholder="Enter your email"> <button type="button">Send</button>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <footer>
    <div class="social-icons">
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
    <p>@RAY-RODGE.2026</p> </footer> </body>
</html>
